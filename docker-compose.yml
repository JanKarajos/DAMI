# Spustenie: docker compose up -d --build   (na Synology: Container Manager → Projekt)
services:
  dami:
    build: .
    image: dami-rezervacie
    container_name: dami
    restart: unless-stopped
    ports:
      - "8080:80"          # web bude na http://IP-NAS:8080
    volumes:
      - ./:/var/www/html   # aplikácia aj dáta (data/, uploads/, config.local.php) zostávajú v tomto priečinku
    environment:
      TZ: Europe/Bratislava
